document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b3995838-eda2-4a43-8bbb-ed83db51915e\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap\" rel=\"stylesheet\">\n<style>\n  body { margin: 0; background: #f4f4f1; -webkit-font-smoothing: antialiased; }\n  a { color: #CC0033; }\n  a:hover { color: #930025; }\n  input, select, textarea, button { font-family: 'Public Sans', system-ui, sans-serif; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; font-family: 'Public Sans', system-ui, sans-serif; color: #1a1a1a;\">\n\n  <div style=\"background: #CC0033; color: #fff; padding: 20px 30px 18px;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px; max-width: 1520px; margin: 0 auto;\">\n      <div>\n        <div style=\"font: 400 10.5px 'Public Sans', system-ui, sans-serif; letter-spacing: 0.13em; text-transform: uppercase; opacity: 0.82;\">Rutgers School of Social Work<\u002Fdiv>\n        <div style=\"font: 500 27px 'Newsreader', Georgia, serif; margin-top: 3px;\">Schedule Projections — Online &amp; Blended<\u002Fdiv>\n        <div style=\"font: 400 12.5px 'Public Sans', system-ui, sans-serif; opacity: 0.9; margin-top: 4px;\">Your student report × each cohort's published curriculum grid → sections needed, term by term.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: flex-end; gap: 9px;\">\n        <div>\n          <div style=\"font: 600 9.5px 'Public Sans', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; margin-bottom: 4px;\">Projection term<\u002Fdiv>\n          <div style=\"display: flex; gap: 7px;\">\n            <sc-raw-select value=\"{{ season }}\" sc-camel-on-change=\"{{ setSeason }}\" style=\"border: none; border-radius: 8px; padding: 8px 10px; font: 600 13px 'Public Sans', system-ui, sans-serif; color: #1a1a1a; background: #fff;\">\n              <option value=\"fall\">Fall<\u002Foption>\n              <option value=\"spring\">Spring<\u002Foption>\n              <option value=\"summer\">Summer<\u002Foption>\n            <\u002Fsc-raw-select>\n            <input value=\"{{ year }}\" sc-camel-on-change=\"{{ setYear }}\" style=\"border: none; border-radius: 8px; padding: 8px 10px; font: 600 13px 'Public Sans', system-ui, sans-serif; color: #1a1a1a; background: #fff; width: 62px;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ prevTerm }}\" title=\"Previous term\" style=\"cursor: pointer; border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.12); color: #fff; border-radius: 8px; padding: 9px 11px; font: 600 13px 'Public Sans', system-ui, sans-serif;\" style-hover=\"background: rgba(255,255,255,0.24);\">←<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nextTerm }}\" title=\"Next term\" style=\"cursor: pointer; border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.12); color: #fff; border-radius: 8px; padding: 9px 11px; font: 600 13px 'Public Sans', system-ui, sans-serif;\" style-hover=\"background: rgba(255,255,255,0.24);\">→<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ doWord }}\" style=\"cursor: pointer; border: none; background: #fff; color: #CC0033; border-radius: 8px; padding: 10px 15px; font: 600 12.5px 'Public Sans', system-ui, sans-serif;\" style-hover=\"background: #ffe9ee;\">Word (.docx)<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ doExcel }}\" style=\"cursor: pointer; border: none; background: #fff; color: #CC0033; border-radius: 8px; padding: 10px 15px; font: 600 12.5px 'Public Sans', system-ui, sans-serif;\" style-hover=\"background: #ffe9ee;\">Excel (.xlsx)<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ doCopy }}\" style=\"cursor: pointer; border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.12); color: #fff; border-radius: 8px; padding: 10px 15px; font: 600 12.5px 'Public Sans', system-ui, sans-serif;\" style-hover=\"background: rgba(255,255,255,0.24);\">{{ copyLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1520px; margin: 0 auto; padding: 22px 30px 60px;\">\n\n    <div style=\"background: #fff; border: 1px solid #e4e4df; border-radius: 13px; margin-bottom: 18px; overflow: hidden;\">\n      <div sc-camel-on-click=\"{{ toggleRoster }}\" style=\"cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 20px;\" style-hover=\"background: #faf9f7;\">\n        <div>\n          <div style=\"font: 600 14.5px 'Public Sans', system-ui, sans-serif;\">1 · Your student report<\u002Fdiv>\n          <div style=\"font: 400 12px 'Public Sans', system-ui, sans-serif; color: #6a6a70; margin-top: 3px;\">{{ rosterSummary }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font: 600 12px 'Public Sans', system-ui, sans-serif; color: #CC0033;\">{{ rosterToggleLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ rosterOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding: 4px 20px 20px; border-top: 1px solid #eeeee9;\">\n          <div style=\"display: grid; grid-template-columns: minmax(310px, 390px) 1fr; gap: 24px; align-items: start;\">\n\n            <div>\n              <div style=\"font: 600 10px 'Public Sans', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a90; margin: 16px 0 7px;\">Paste the report<\u002Fdiv>\n              <div style=\"font: 400 11.5px 'Public Sans', system-ui, sans-serif; color: #6a6a70; line-height: 1.55; margin-bottom: 8px;\">Select all in the spreadsheet — <strong>including the header row<\u002Fstrong> — and paste here. It reads Academic Cohort, Academic Program, Not Registered, LOA, Specialization and Certificate, and applies each to the term you're projecting.<\u002Fdiv>\n              <textarea value=\"{{ rosterText }}\" sc-camel-on-change=\"{{ setRoster }}\" placeholder=\"RUID\tLast Name\tFirst Name\t…\tAcademic Program\tAcademic Cohort\" style=\"width: 100%; box-sizing: border-box; height: 124px; border: 1px solid #dedeD8; border-radius: 9px; padding: 10px 12px; font: 400 11px ui-monospace, monospace; color: #1a1a1a; resize: vertical;\"><\u002Ftextarea>\n              <div style=\"display: flex; align-items: center; gap: 10px; margin-top: 8px;\">\n                <div style=\"font: 500 11.5px 'Public Sans', system-ui, sans-serif; color: {{ parseColor }};\">{{ parseStatus }}<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ clearRoster }}\" style=\"cursor: pointer; border: none; background: none; padding: 0; font: 600 11.5px 'Public Sans', system-ui, sans-serif; color: #8a8a90; text-decoration: underline; display: {{ clearDisplay }};\">clear<\u002Fbutton>\n              <\u002Fdiv>\n\n              <div style=\"margin-top: 16px; display: {{ exclDisplay }};\">\n                <div style=\"font: 600 10px 'Public Sans', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a90; margin-bottom: 7px;\">Report flags for {{ termLabel }}<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n                  <sc-for list=\"{{ exclusions }}\" as=\"x\" hint-placeholder-count=\"3\">\n                    <label style=\"display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid {{ x.border }}; background: {{ x.bg }}; border-radius: 8px; cursor: pointer; font: 500 12px 'Public Sans', system-ui, sans-serif;\">\n                      <input type=\"checkbox\" checked=\"{{ x.on }}\" sc-camel-on-change=\"{{ x.toggle }}\" style=\"accent-color: #CC0033;\">\n                      <span style=\"flex: 1;\">{{ x.label }}<\u002Fspan>\n                      <span style=\"font-weight: 600; color: #6a6a70;\">{{ x.count }}<\u002Fspan>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font: 400 10.5px 'Public Sans', system-ui, sans-serif; color: #9a9aa0; line-height: 1.5; margin-top: 7px;\">Checked groups are counted in the projection. A financial hold you expect to clear can be counted back in.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top: 14px; padding: 10px 13px; border: 1px solid #f0d3bf; background: #fdf5ef; border-radius: 9px; display: {{ unknownDisplay }};\">\n                <div style=\"font: 700 11.5px 'Public Sans', system-ui, sans-serif; color: #b0561f; margin-bottom: 4px;\">Cohort labels I couldn't place<\u002Fdiv>\n                <div style=\"font: 400 11.5px 'Public Sans', system-ui, sans-serif; color: #7a4a2a; line-height: 1.5;\">{{ unknownList }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 16px 0 7px;\">\n                <div style=\"font: 600 10px 'Public Sans', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a90;\">Cohorts enrolled in {{ termLabel }}<\u002Fdiv>\n                <div style=\"font: 400 11px 'Public Sans', system-ui, sans-serif; color: #8a8a90;\">edit any number to override the report<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(186px, 1fr)); gap: 8px;\">\n                <sc-for list=\"{{ cohorts }}\" as=\"c\" hint-placeholder-count=\"10\">\n                  <div style=\"border: 1px solid {{ c.border }}; background: {{ c.bg }}; border-radius: 10px; padding: 9px 11px;\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px;\">\n                      <div style=\"font: 700 13px 'Public Sans', system-ui, sans-serif; color: #1a1a1a;\">{{ c.code }}<\u002Fdiv>\n                      <input value=\"{{ c.n }}\" sc-camel-on-change=\"{{ c.setN }}\" style=\"width: 48px; text-align: center; border: 1px solid #dedeD8; border-radius: 7px; padding: 4px 5px; font: 600 12.5px 'Public Sans', system-ui, sans-serif; background: #fff;\">\n                    <\u002Fdiv>\n                    <div style=\"font: 400 10.5px 'Public Sans', system-ui, sans-serif; color: #7a7a80; margin-top: 4px; line-height: 1.4;\">{{ c.meta }}<\u002Fdiv>\n                    <div style=\"font: 500 10.5px 'Public Sans', system-ui, sans-serif; color: {{ c.srcColor }}; margin-top: 3px;\">{{ c.srcLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"padding: 16px; border: 1px dashed #dedeD8; border-radius: 10px; font: 400 12px 'Public Sans', system-ui, sans-serif; color: #8a8a90; display: {{ noCohortsDisplay }};\">No cohort is scheduled to be enrolled in this term — change the projection term above, or paste your report.<\u002Fdiv>\n\n              <div style=\"display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #eeeee9;\">\n                <div style=\"flex: 1; min-width: 220px;\">\n                  <div style=\"font: 600 10px 'Public Sans', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a90; margin-bottom: 7px;\">Specialization split<\u002Fdiv>\n                  <div style=\"font: 400 11.5px 'Public Sans', system-ui, sans-serif; color: #6a6a70; line-height: 1.55; margin-bottom: 8px;\">{{ specNote }}<\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 7px;\">\n                    <input value=\"{{ clinPct }}\" sc-camel-on-change=\"{{ setClinPct }}\" style=\"width: 50px; text-align: center; border: 1px solid #dedeD8; border-radius: 8px; padding: 6px 6px; font: 700 13px 'Public Sans', system-ui, sans-serif;\">\n                    <span style=\"font: 500 11.5px 'Public Sans', system-ui, sans-serif; color: #6a6a70;\">% clinical where undeclared<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex: 1.4; min-width: 280px;\">\n                  <div style=\"font: 600 10px 'Public Sans', system-ui, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a90; margin-bottom: 7px;\">Add a group by hand<\u002Fdiv>\n                  <div style=\"font: 400 11.5px 'Public Sans', system-ui, sans-serif; color: #6a6a70; line-height: 1.55; margin-bottom: 8px;\">For a group the report doesn't label yet — name it, pick the cohort grid it follows, and how far behind.<\u002Fdiv>\n                  <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center;\">\n                    <input value=\"{{ ogLabel }}\" sc-camel-on-change=\"{{ setOgLabel }}\" placeholder=\"FT8*-9\" style=\"width: 86px; border: 1px solid #dedeD8; border-radius: 8px; padding: 7px 9px; font: 600 12px 'Public Sans', system-ui, sans-serif;\">\n                    <sc-raw-select value=\"{{ ogBase }}\" sc-camel-on-change=\"{{ setOgBase }}\" style=\"border: 1px solid #dedeD8; border-radius: 8px; padding: 7px 9px; font: 500 12px 'Public Sans', system-ui, sans-serif; background: #fff;\">\n                      <sc-for list=\"{{ allCohortCodes }}\" as=\"o\" hint-placeholder-count=\"4\">\n                        <option value=\"{{ o.code }}\">{{ o.code }}<\u002Foption>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-select>\n                    <sc-raw-select value=\"{{ ogBehind }}\" sc-camel-on-change=\"{{ setOgBehind }}\" style=\"border: 1px solid #dedeD8; border-radius: 8px; padding: 7px 9px; font: 500 12px 'Public Sans', system-ui, sans-serif; background: #fff;\">\n                      <option value=\"1\">1 behind<\u002Foption>\n                      <option value=\"2\">2 behind<\u002Foption>\n                      <option value=\"3\">3 behind<\u002Foption>\n                    <\u002Fsc-raw-select>\n                    <input value=\"{{ ogN }}\" sc-camel-on-change=\"{{ setOgN }}\" placeholder=\"#\" style=\"width: 46px; text-align: center; border: 1px solid #dedeD8; border-radius: 8px; padding: 7px 9px; font: 600 12px 'Public Sans', system-ui, sans-serif;\">\n                    <button sc-camel-on-click=\"{{ addOg }}\" style=\"cursor: pointer; border: none; background: #1a1a1a; color: #fff; border-radius: 8px; padding: 8px 13px; font: 600 12px 'Public Sans', system-ui, sans-serif;\" style-hover=\"background: #333;\">Add<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px;\">\n                    <sc-for list=\"{{ ogList }}\" as=\"g\" hint-placeholder-count=\"0\">\n                      <div style=\"display: flex; align-items: center; gap: 8px; border: 1px solid #f0d3bf; background: #fdf5ef; border-radius: 999px; padding: 6px 8px 6px 12px; font: 600 11.5px 'Public Sans', system-ui, sans-serif; color: #7a4a2a;\">\n                        <span>{{ g.desc }}<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ g.remove }}\" style=\"cursor: pointer; border: none; background: none; color: #b0561f; font: 700 13px 'Public Sans', system-ui, sans-serif; line-height: 1; padding: 0 2px;\">✕<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background: #fff; border: 1px solid #e4e4df; border-radius: 13px; margin-bottom: 18px; overflow: hidden;\">\n      <div sc-camel-on-click=\"{{ toggleAdm }}\" style=\"cursor: point { q.name }}<\u002Fspan>\n              <span style=\"font: 600 9.5px 'Public Sans', system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8a90;\">{{ q.slot }}<\u002Fspan>\n              <span style=\"font: 600 11px 'Public Sans', system-ui, sans-serif; color: {{ q.stateColor }};\">{{ q.state }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ q.remove }}\" style=\"cursor: pointer; border: none; background: none; color: #b0b0b6; font: 700 12px 'Public Sans', system-ui, sans-serif; padding: 0 2px;\" style-hover=\"color: #b0261f;\">✕<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center;\">\n          <sc-raw-select value=\"{{ reqCert }}\" sc-camel-on-change=\"{{ setReqCert }}\" style=\"border: 1px solid #dedeD8; border-radius: 8px; padding: 7px 9px; font: 600 12px 'Public Sans', system-ui, sans-serif; background: #fff;\">\n            <sc-for list=\"{{ certOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <option value=\"{{ o.code }}\">{{ o.code }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <input value=\"{{ reqNum }}\" sc-camel-on-change=\"{{ setReqNum }}\" placeholder=\"19:912:567\" style=\"width: 100px; border: 1px solid #dedeD8; border-radius: 8px; padding: 7px 9px; font: 600 12px 'Public Sans', system-ui, sans-serif;\">\n          <input value=\"{{ reqName }}\" sc-camel-on-change=\"{{ setReqName }}\" placeholder=\"course name\" style=\"flex: 1; min-width: 200px; border: 1px solid #dedeD8; border-radius: 8px; padding: 7px 9px; font: 500 12px 'Public Sans', system-ui, sans-serif;\">\n          <sc-raw-select value=\"{{ reqSlot }}\" sc-camel-on-change=\"{{ setReqSlot }}\" style=\"border: 1px solid #dedeD8; border-radius: 8px; padding: 7px 9px; font: 500 12px 'Public Sans', system-ui, sans-serif; background: #fff;\">\n            <option value=\"EL\">General elective<\u002Foption>\n            <option value=\"APD\">APD requirement<\u002Foption>\n            <option value=\"ACP\">ACP requirement<\u002Foption>\n          <\u002Fsc-raw-select>\n          <button sc-camel-on-click=\"{{ addReq }}\" style=\"cursor: pointer; border: none; background: #1a1a1a; color: #fff; border-radius: 8px; padding: 8px 14px; font: 600 12px 'Public Sans', system-ui, sans-serif;\" style-hover=\"background: #333;\">Add requirement<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #fff; border: 1px solid #e4e4df; border-radius: 13px; padding: 18px 20px 20px;\">\n      <div style=\"font: 500 19px 'Newsreader', Georgia, serif; margin-bottom: 4px;\">Notes for the scheduler<\u002Fdiv>\n      <div style=\"font: 400 11.5px 'Public Sans', system-ui, sans-serif; color: #7a7a80; margin-bottom: 10px;\">Seminar meeting dates, synchronous sections, anything the grid can't say. These travel into the Word and Excel exports.<\u002Fdiv>\n      <textarea value=\"{{ notes }}\" sc-camel-on-change=\"{{ setNotes }}\" placeholder=\"Blended Reflective Practice Seminar dates (on Zoom)\nSection 1 — Tuesdays, 6:00–9:00pm …\" style=\"width: 100%; box-sizing: border-box; height: 110px; border: 1px solid #dedeD8; border-radius: 9px; padding: 10px 12px; font: 400 12.5px 'Public Sans', system-ui, sans-serif; color: #1a1a1a; resize: vertical; line-height: 1.6;\"><\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div style=\"font: 400 10.5px 'Public Sans', system-ui, sans-serif; color: #a0a0a6; line-height: 1.6; margin-top: 16px;\">Projected from each cohort's published Curriculum at a Glance. Sections are headcount ÷ seat cap, rounded up — edit any cell before exporting. Practicum courses carry no seat cap; their seminars do. Edited cells are outlined in red.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1520}}\">\nclass Component extends DCLogic {\n  KEY = 'msw-sched-proj-v3';\n\n  state = {\n    season: 'fall', year: 2027,\n    rosterText: '', rosterOpen: true,\n    inc: {}, counts: {}, ov: {}, elecOv: {}, elecExtra: [], elecMeta: {}, adm: {}, admOpen: false,\n    certMeta: {}, certReqs: {},\n    reqCert: '', reqNum: '', reqName: '', reqSlot: 'EL',\n    og: [], ogLabel: '', ogBase: '', ogBehind: '1', ogN: '',\n    clinPct: 85, notes: '', copied: false,\n  };\n\n  componentDidMount() {\n    try { const s = JSON.parse(localStorage.getItem(this.KEY) || 'null'); if (s) this.setState(s); } catch (e) {}\n  }\n\n  put(patch) {\n    this.setState(patch, () => {\n      const keys = ['season', 'year', 'rosterText', 'inc', 'counts', 'ov', 'elecOv', 'elecExtra', 'elecMeta', 'adm', 'certMeta', 'certReqs', 'og', 'clinPct', 'notes'];\n      const out = {}; keys.forEach(k => out[k] = this.state[k]);\n      try { localStorage.setItem(this.KEY, JSON.stringify(out)); } catch (e) {}\n    });\n  }\n\n  RANK = { spring: 0, summer: 1, fall: 2 };\n  ti(season, year) { return year * 3 + this.RANK[season]; }\n  fromTi(t) { return { year: Math.floor(t / 3), season: ['spring', 'summer', 'fall'][t % 3] }; }\n  capw(s) { return s.charAt(0).toUpperCase() + s.slice(1); }\n\n  termTok(season, year) {\n    const p = { fall: 'F', spring: 'SP', summer: 'SU' }[season];\n    const yy = String(year).slice(2);\n    return season === 'fall' ? ['F' + yy, 'FA' + yy] : [p + yy];\n  }\n  tokMatches(text, season, year) {\n    if (!text) return false;\n    return this.termTok(season, year).some(t => new RegExp('(^|[^A-Z0-9])' + t + '([^0-9]|$)', 'i').test(text));\n  }\n\n  cat() {\n    return {\n      HBSE: { num: '19:912:502', name: 'HBSE', cr: 3, cap: 25 },\n      SWP: { num: '19:912:504', name: 'SWPS', cr: 3, cap: 25 },\n      DIV: { num: '19:912:506', name: 'Diversity & Oppression', cr: 3, cap: 25 },\n      PIF: { num: '19:912:500', name: 'Practice IFG', cr: 3, cap: 22 },\n      PCO: { num: '19:912:501', name: 'Practice OC', cr: 3, cap: 22 },\n      CAD: { num: '19:912:507', name: 'Clinical Assessment & Diagnosis', cr: 3, cap: 25 },\n      RES: { num: '19:912:505', name: 'Methods of SW Research', cr: 3, cap: 22 },\n      EVAL: { num: '19:913:587', name: 'Evaluation of SW Prac and Prog', cr: 3, cap: 22 },\n      SP1C: { num: '19:913:501', name: 'Clinical SW 1', cr: 3, cap: 22 },\n      SP1M: { num: '19:913:505', name: 'Management Practice Theory', cr: 3, cap: 22 },\n      SP2C: { num: '19:913:502', name: 'Clinical SW 2', cr: 3, cap: 22 },\n      SP2M: { num: '19:913:506', name: 'Program and Strategic Planning', cr: 3, cap: 22 },\n      LAB: { num: '19:912:511', name: 'Practicum Lab Seminar', cr: 1, cap: 25 },\n      REF: { num: '19:912:512', name: 'Reflective Practice Seminar', cr: 1, cap: 25 },\n      ASLAB: { num: '19:912:513', name: 'AS Practicum Lab Seminar', cr: 3, cap: 25 },\n    };\n  }\n\n  suffix(num) { return parseInt(String(num).split(':').pop(), 10) || 0; }\n\n  prac(n, cr) {\n    return { num: '19:914:59' + n, name: 'Practicum ' + n + (String(cr) === '2.5' ? '-2.5' : ''), cr: +cr, cap: 999 };\n  }\n\n  grids() {\n    const G = {\n      'FT|fall': [['HBSE', 'SWP', 'DIV'], ['PIF', 'EL', 'CAD', 'P1:1', 'LAB'], ['RES', 'EL', 'P2:1', 'REF'], ['PCO', 'EL', 'P3:2'], ['SP1', 'APD', 'EVAL', 'P4:3'], ['SP2', 'ACP', 'EL', 'P5:3']],\n      'FT|spring': [['HBSE', 'SWP', 'DIV'], ['PIF', 'EL', 'P1:1', 'LAB'], ['PCO', 'RES', 'CAD', 'P2:1', 'REF'], ['EL', 'EL', 'P3:2'], ['SP1', 'EVAL', 'ACP', 'P4:3'], ['SP2', 'APD', 'EL', 'P5:3']],\n      'FT|summer': [['HBSE', 'SWP', 'DIV'], ['PIF', 'CAD', 'LAB', 'P1:1'], ['PCO', 'RES', 'REF', 'P2:1', 'EL'], ['EL', 'EL', 'P3:2'], ['SP1', 'EVAL', 'EL', 'P4:3'], ['SP2', 'APD', 'ACP', 'P5:3']],\n      'ON|fall': [['HBSE', 'DIV'], ['SWP', 'CAD'], ['PIF', 'P1:1', 'LAB'], ['PCO', 'RES', 'P2:1', 'REF'], ['EL', 'EL', 'P3:2'], ['EVAL', 'P4:2'], ['SP1', 'EL', 'P5:2'], ['SP2', 'APD', 'P6:2'], ['ACP', 'EL']],\n      'ON|spring': [['HBSE', 'DIV'], ['SWP', 'CAD'], ['PIF', 'EL', 'LAB', 'P1:1'], ['PCO', 'RES', 'REF', 'P2:1'], ['EL', 'P3:2'], ['SP1', 'EVAL', 'P4:2'], ['SP2', 'APD', 'P5:2'], ['ACP', 'P6:2'], ['EL', 'EL']],\n      'ON|summer': [['HBSE', 'DIV'], ['SWP', 'CAD'], ['PIF', 'EL', 'LAB', 'P1:1'], ['RES', 'REF', 'P2:1'], ['PCO', 'EL', 'P3:2'], ['SP1', 'EL', 'P4:2'], ['EL', 'P5:2'], ['SP2', 'EVAL', 'P6:2'], ['ACP', 'APD']],\n      'BL|fall': [['HBSE', 'SWP'], ['PIF', 'DIV', 'P1:1', 'LAB'], ['CAD'], ['PCO', 'RES', 'P2:1', 'REF'], ['EL', 'EL', 'P3:2'], ['EVAL', 'P4:2'], ['SP1', 'APD', 'P5:2'], ['SP2', 'EL', 'P6:2'], ['ACP', 'EL']],\n      'AS|fall': [['SP1', 'CAD', 'ASLAB', 'P4:2'], ['SP2', 'APD', 'EL', 'P5:2'], ['ACP', 'EL', 'P6:2'], ['EVAL', 'EL', 'EL']],\n      'AS|summer': [['CAD', 'ACP', 'ASLAB'], ['SP1', 'EVAL', 'EL', 'P4:2'], ['SP2', 'EL', 'EL', 'P5:2'], ['APD', 'EL', 'P6:2']],\n    };\n    const C = {\n      'FT|fall|2024': [['HBSE', 'DIV', 'PIF', 'P1:2'], ['CAD', 'SWP', 'PCO', 'P2:2'], ['RES', 'EL', 'P3:2'], ['SP1', 'EVAL', 'EL', 'P4:3'], ['SP2', 'APD', 'EL', 'P5:3'], ['ACP', 'EL']],\n      'FT|spring|2025': [['HBSE', 'DIV', 'PIF', 'P1:1', 'LAB'], ['CAD', 'EL', 'P2:1', 'REF'], ['SWP', 'PCO', 'RES', 'P3:2'], ['SP1', 'ACP', 'EL', 'P4:3'], ['EVAL', 'EL', 'P5:3'], ['SP2', 'APD', 'EL']],\n      'ON|fall|2023': [['HBSE', 'DIV'], ['CAD', 'SWP'], ['PIF', 'P1:2'], ['PCO', 'RES', 'P2:2'], ['EL', 'EL', 'P3:2'], ['EVAL', 'P4:2'], ['SP1', 'EL', 'P5:2'], ['SP2', 'APD', 'P6:2'], ['ACP', 'EL']],\n      'ON|spring|2024': [['HBSE', 'DIV'], ['CAD', 'SWP'], ['PIF', 'EL', 'P1:2'], ['PCO', 'RES', 'P2:2'], ['EL', 'P3:2'], ['SP1', 'EVAL', 'P4:2'], ['SP2', 'APD', 'P5:2'], ['ACP', 'P6:2'], ['EL', 'EL']],\n      'ON|summer|2024': [['HBSE', 'DIV'], ['CAD', 'SWP'], ['PIF', 'EL', 'P1:1', 'LAB'], ['RES', 'P2:1', 'REF'], ['PCO', 'EL', 'P3:2'], ['SP1', 'EL', 'P4:2'], ['EL', 'P5:2'], ['SP2', 'EVAL', 'P6:2'], ['ACP', 'APD']],\n      'ON|fall|2024': [['HBSE', 'DIV'], ['CAD', 'PIF'], ['SWP', 'P1:1', 'LAB'], ['PCO', 'RES', 'P2:1'], ['EL', 'EL', 'P3:2', 'REF'], ['EVAL', 'SP1', 'P4:2'], ['SP2', 'EL', 'P5:2'], ['ACP', 'APD', 'P6:2'], ['EL']],\n      'ON|spring|2025': [['HBSE', 'DIV'], ['CAD', 'SWP'], ['PIF', 'EL', 'P1:1', 'LAB'], ['PCO', 'RES', 'P2:1', 'REF'], ['EL', 'P3:2'], ['SP1', 'EVAL', 'P4:2'], ['SP2', 'APD', 'P5:2'], ['ACP', 'EL', 'P6:2'], ['EL']],\n    };\n    return { G, C };\n  }\n\n  cohortStart(prefix, num) {\n    if (prefix === 'FT') return this.fromTi(this.ti('spring', 2025) + (num - 8));\n    if (prefix === 'ON') return this.fromTi(this.ti('fall', 2025) + (num - 37));\n    if (prefix === 'BL') return { season: 'fall', year: 2024 + (num - 12) };\n    if (prefix === 'AS') return { season: 'fall', year: 2024 + (num - 10) };\n    return null;\n  }\n\n  progName(prefix) {\n    return { FT: 'Full-time · 2-year, online', ON: 'Part-time · 3-year, online', BL: 'Blended · 3-year', AS: 'Advanced standing' }[prefix] || '';\n  }\n\n  gridFor(prefix, start) {\n    const { G, C } = this.grids();\n    return C[prefix + '|' + start.season + '|' + start.year] || G[prefix + '|' + start.season] || null;\n  }\n\n  normCohort(raw) {\n    const s = String(raw || '').trim();\n    if (!s) return null;\n    // Offer rescinded — the student never enrolls, so they leave the projection entirely.\n    if (/(^|\\b)RSC\\b/i.test(s)) return { rescinded: true };\n    if (/^Cohort\\s*(LOA|P|NR|M|NC|W|WD|ADM|DEF|DIS)\\b/i.test(s)) {\n      // \"Cohort LOA (SU27=B13)\" — returning Summer 2027 and joining cohort BL13 when they do.\n      const m = s.match(/\\(\\s*([A-Z]{2})\\s*(\\d{2,4})\\s*=\\s*([A-Z]{1,3})?\\s*(\\d+)\\s*\\)/i);\n      if (m) {\n        const SEA = { su: 'summer', sm: 'summer', fa: 'fall', fl: 'fall', sp: 'spring', sr: 'spring', wi: 'spring' };\n        const PFX = { b: 'BL', bl: 'BL', o: 'ON', on: 'ON', f: 'FT', ft: 'FT', a: 'AS', as: 'AS', p: 'ON', pt: 'ON' };\n        const p = PFX[(m[3] || 'on').toLowerCase()] || (m[3] || 'ON').toUpperCase();\n        const season = SEA[m[1].toLowerCase()];\n        const yr = +m[2] < 100 ? 2000 + +m[2] : +m[2];\n        return { code: p + (+m[4]), pending: true, retTi: season ? this.ti(season, yr) : null, retLabel: season ? this.capw(season) + ' ' + yr : null };\n      }\n      return { code: null, label: s };\n    }\n    let m = s.match(/^AS\\s*C?-?\\s*(\\d+)/i); if (m) return { code: 'AS' + +m[1] };\n    m = s.match(/^Blended\\s*(\\d+)/i); if (m) return { code: 'BL' + +m[1] };\n    m = s.match(/^FT\\s*Cohort\\s*(\\d+)/i); if (m) return { code: 'FT' + +m[1] };\n    m = s.match(/^Cohort\\s*(\\d+)/i); if (m) return { code: 'ON' + +m[1] };\n    m = s.match(/^(ON|FT|AS|BL|PT)\\s*-?(\\d+)/i); if (m) { const p = m[1].toUpperCase(); return { code: (p === 'PT' ? 'ON' : p) + +m[2] }; }\n    return { code: null, label: s };\n  }\n\n  parseRoster() {\n    const lines = (this.state.rosterText || '').split(/\\r?\\n/).filter(l => l.trim());\n    const out = { rows: [], unknown: {}, headerFound: false, rescinded: 0 };\n    if (!lines.length) return out;\n    const split = l => (l.indexOf('\\t') >= 0 ? l.split('\\t') : l.split(/\\s{2,}|,/));\n    const hdr = split(lines[0]).map(h => h.trim().toLowerCase());\n    const want = { cohort: 'academic cohort', program: 'academic program', nr: 'not registered', loa: 'loa', spec: 'specialization', cert: 'certificate' };\n    const idx = {};\n    Object.keys(want).forEach(k => { idx[k] = hdr.indexOf(want[k]); });\n    out.headerFound = idx.cohort >= 0;\n    (out.headerFound ? lines.slice(1) : lines).forEach(l => {\n      const f = split(l).map(x => x.trim());\n      const g = k => (idx[k] >= 0 ? (f[idx[k]] || '') : '');\n      let cohortRaw = g('cohort');\n      if (!out.headerFound) {\n        const hit = f.find(x => { const n = this.normCohort(x); return n && n.code; });\n        cohortRaw = hit || '';\n      }\n      const nc = this.normCohort(cohortRaw);\n      if (!nc) return;\n      if (nc.rescinded) { out.rescinded++; return; }\n      if (!nc.code) { const key = nc.label || '(blank)'; out.unknown[key] = (out.unknown[key] || 0) + 1; return; }\n      out.rows.push({\n        code: nc.code, pending: !!nc.pending, retTi: nc.retTi != null ? nc.retTi : null, retLabel: nc.retLabel || null,\n        program: (g('program') || '').toUpperCase(),\n        nr: g('nr'), loa: g('loa'), spec: g('spec'), cert: (g('cert') || '').toUpperCase(),\n      });\n    });\n    return out;\n  }\n\n  flagFor(r, season, year) {\n    if (this.tokMatches(r.loa, season, year)) return { key: 'loa', label: 'On an LOA for this term' };\n    if (this.tokMatches(r.nr, season, year)) {\n      return /\\$/.test(r.nr) ? { key: 'nr$', label: 'Not registering — financial hold ($)' } : { key: 'nr', label: 'Not registering (NR)' };\n    }\n    if (r.pending) {\n      // A stated return term is authoritative: away until it arrives, then a normal member\n      // of the cohort they return into.\n      if (r.retTi != null) {\n        return this.ti(season, year) < r.retTi\n          ? { key: 'pending', label: 'On an LOA — returning ' + (r.retLabel || 'later') }\n          : null;\n      }\n      return { key: 'pending', label: 'Cohort LOA / pending — placed by return term' };\n    }\n    return null;\n  }\n\n  // Admissions history: [admits, admit/coming, final admit/coming] per year, from the Online MSW Yield sheet.\n  admHist() {\n    return {\n      'ON|fall': [[91, 68, 65], [98, 73, 68], [95, 70, 63]],\n      'FT|fall': [[126, 85, 75], [184, 126, 100], [170, 123, 96]],\n      'AS|fall': [[91, 70, 58], [110, 86, 76], [90, 71, 60]],\n      'ON|summer': [[32, 26, 23], [36, 28, 25], [32, 26, 19]],\n      'FT|summer': [[36, 34, 23], [59, 44, 35], [57, 46, 38]],\n      'ON|spring': [[71, 55, 47], [70, 57, 52], [66, 45, 40], [60, 46, 32]],\n      'FT|spring': [[49, 42, 34], [81, 65, 51], [106, 86, 68], [129, 84, 65]],\n      'BL|fall': [[73, 49, 52]],\n    };\n  }\n  admTargets() {\n    return { 'ON|fall': 60, 'FT|fall': 100, 'AS|fall': 75, 'BL|fall': 50, 'ON|summer': 25, 'FT|summer': 35, 'ON|spring': 40, 'FT|spring': 65 };\n  }\n  // In-cycle snapshot from the applications/projections sheet (4/6/26), keyed by entry term.\n  admCycle() {\n    return {\n      'ON|fall|2026': { apps: 88, admits: 47, coming: 35, target: 60 },\n      'FT|fall|2026': { apps: 225, admits: 93, coming: 54, target: 100 },\n      'AS|fall|2026': { apps: 95, admits: 35, coming: 16, target: 75 },\n      'BL|fall|2026': { apps: 118, admits: 66, coming: 48, target: 50 },\n      'ON|summer|2026': { apps: 48, admits: 29, coming: 18, target: 25 },\n      'FT|summer|2026': { apps: 159, admits: 79, coming: 48, target: 35 },\n    };\n  }\n  admKeyLabel(key) {\n    const [p, s] = key.split('|');\n    return this.capw(s) + ' ' + { FT: '2-year (FT)', ON: '3-year (PT)', AS: 'Adv. Standing', BL: 'Blended' }[p];\n  }\n  admRates(key) {\n    const h = this.admHist()[key] || [];\n    if (!h.length) return { yield: 0, coming: 0, years: 0 };\n    const y = h.reduce((a, r) => a + r[2] / r[0], 0) / h.length;\n    const c = h.reduce((a, r) => a + r[2] / r[1], 0) / h.length;\n    return { yield: y, coming: c, years: h.length };\n  }\n  // What admissions expects to enrol for a cohort that is still applying.\n  // key = prefix|season (history/rates); year scopes the live cycle numbers.\n  admProject(key, year) {\n    const ck = key + '|' + year;\n    const cyc = this.admCycle()[ck] || {};\n    const e = { ...cyc, ...(((this.state.adm || {})[ck]) || {}) };\n    const rates = this.admRates(key);\n    const num = v => (v === '' || v === undefined || v === null ? null : Math.max(0, parseFloat(v) || 0));\n    const target = num(e.target) !== null ? num(e.target) : (this.admTargets()[key] || null);\n    const yld = num(e.yield) !== null ? num(e.yield) / 100 : rates.yield;\n    const final = num(e.final), coming = num(e.coming), admits = num(e.admits);\n    if (final !== null) return { n: Math.round(final), basis: 'final admit/coming' };\n    if (coming !== null && rates.coming) return { n: Math.round(coming * rates.coming), basis: 'admit/coming × ' + Math.round(rates.coming * 100) + '% (melt-adjusted)' };\n    if (admits !== null && yld) return { n: Math.round(admits * yld), basis: 'admits × ' + Math.round(yld * 100) + '% yield' };\n    if (target !== null) return { n: Math.round(target), basis: 'enrollment target' };\n    return { n: 0, basis: '' };\n  }\n  currentTi() {\n    const d = new Date(), m = d.getMonth();\n    const season = m <= 3 ? 'spring' : (m <= 7 ? 'summer' : 'fall');\n    return this.ti(season, d.getFullYear());\n  }\n\n  // level: 'advanced' fills an advanced elective slot (specialized phase).\n  // from/to bound the terms a course is actually offered in.\n  defaultElectives() {\n    return [\n      { num: '19:912:503', name: 'Social Work with Latinos' },\n      { num: '19:912:529', name: 'Adolescence: Risk & Resiliency' },\n      { num: '19:912:530', name: 'Solution Focused Therapy', fulfills: 'ADV' },\n      { num: '19:912:541', name: 'Fundraising and Marketing', fulfills: 'APD-MAP' },\n      { num: '19:912:543', name: 'Social Work with Immigrants & Refugees', to: ['fall', 2026] },\n      { num: '19:912:543', name: 'Motivational Interviewing and Trauma-Informed Practice', from: ['spring', 2027], isNew: true },\n      { num: '19:912:544', name: 'Poverty, Inequality, Discrimination & Public Policy' },\n      { num: '19:912:547', name: 'SW with Loss Across the Lifespan' },\n      { num: '19:912:562', name: 'Chronic Illness and Disabilities' },\n      { num: '19:912:564', name: 'Gender, Women, Int SJ' },\n      { num: '19:912:567', name: 'Violence and Abuse in Childhood', isNew: true },\n      { num: '19:912:572', name: 'Aging Services' },\n    ].filter(e => {\n      const t = this.ti(this.state.season, +this.state.year || 0);\n      if (e.from && t < this.ti(e.from[0], e.from[1])) return false;\n      if (e.to && t > this.ti(e.to[0], e.to[1])) return false;\n      return true;\n    });\n  }\n\n  // Spring 2026 actuals (100% online sections only, practicum and cancelled rows excluded):\ c.count - a.count);\n    const totalExcluded = Object.keys(b.flags).reduce((a, k) => a + (this.state.inc[k] ? 0 : b.flags[k].count), 0);\n    const unknownKeys = Object.keys(b.roster.unknown);\n    const declared = b.groups.reduce((a, g) => a + (g.agg ? g.agg.csw + g.agg.map : 0), 0);\n    const view = { olRows, blRows, electives, termLabel, poolCohorts: b.pool.cohorts.join(', ') };\n    const fileBase = 'MSW Schedule Projections — ' + termLabel;\n\n    return {\n      season, year: this.state.year, termLabel,\n      setSeason: e => this.put({ season: e.target.value, copied: false }),\n      setYear: e => this.put({ year: e.target.value.replace(/[^\\d]/g, '').slice(0, 4), copied: false }),\n      prevTerm: () => { const t = this.fromTi(this.ti(season, year) - 1); this.put({ season: t.season, year: t.year, copied: false }); },\n      nextTerm: () => { const t = this.fromTi(this.ti(season, year) + 1); this.put({ season: t.season, year: t.year, copied: false }); },\n      doWord: () => this.download(this.docx(view), fileBase + '.docx'),\n      doExcel: () => this.download(this.xlsx(view), fileBase + '.xlsx'),\n      copyLabel: this.state.copied ? 'Copied ✓' : 'Copy as table',\n      doCopy: () => {\n        const text = this.tsvOut(view);\n        const done = () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 2200); };\n        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();\n      },\n\n      rosterOpen: this.state.rosterOpen,\n      toggleRoster: () => this.setState({ rosterOpen: !this.state.rosterOpen }),\n      rosterToggleLabel: this.state.rosterOpen ? 'Hide' : 'Edit',\n      rosterSummary: totalActive > 0\n        ? totalActive + ' students expected to register in ' + termLabel + ' across ' + cohortCards.filter(c => +c.n > 0).length + ' cohorts' + (totalExcluded ? ' · ' + totalExcluded + ' held out by report flags' : '')\n        : 'Paste your student report, or type headcounts by cohort, to project ' + termLabel,\n      rosterText: this.state.rosterText,\n      setRoster: e => this.put({ rosterText: e.target.value, counts: {}, copied: false }),\n      clearDisplay: (this.state.rosterText || '').length ? 'inline' : 'none',\n      clearRoster: () => this.put({ rosterText: '', copied: false }),\n      parseStatus: !(this.state.rosterText || '').trim() ? 'Nothing pasted yet'\n        : (b.roster.rows.length + ' students read' + (b.roster.rescinded ? ' · ' + b.roster.rescinded + ' rescinded (RSC) dropped' : '') + (b.roster.headerFound ? ' · header row recognised' : ' · no header row found, guessing columns')),\n      parseColor: !(this.state.rosterText || '').trim() ? '#9a9aa0' : (b.roster.headerFound ? '#2e7d5b' : '#b0561f'),\n\n      exclusions, exclDisplay: exclusions.length ? 'block' : 'none',\n      unknownDisplay: unknownKeys.length ? 'block' : 'none',\n      unknownList: unknownKeys.map(k => k + ' (' + b.roster.unknown[k] + ')').join(' · '),\n\n      cohorts: cohortCards, noCohortsDisplay: cohortCards.length ? 'none' : 'block',\n\n      admOpen: this.state.admOpen,\n      toggleAdm: () => this.setState({ admOpen: !this.state.admOpen }),\n      admToggleLabel: this.state.admOpen ? 'Hide' : 'Edit',\n      admSummary: (() => {\n        const used = b.groups.filter(g => g.src === 'admissions' && g.n > 0);\n        return used.length\n          ? used.map(g => g.code + ' ' + g.n).join(' · ') + ' — projected from admissions, not yet in the report'\n          : 'No cohort in ' + termLabel + ' needs an admissions projection — all of them are in the report';\n      })(),\n      admRows: (() => {\n        // One row per entry term that actually feeds this projection; if none, the next\n        // three entry terms so the numbers can be loaded before they are needed.\n        const needed = [];\n        b.groups.forEach(g => {\n          if (g.src !== 'admissions') return;\n          const ck = g.admKey + '|' + g.admYear;\n          if (!needed.some(x => x.ck === ck)) needed.push({ ck, key: g.admKey, year: g.admYear, codes: [g.code] });\n          else needed.find(x => x.ck === ck).codes.push(g.code);\n        });\n        let list = needed;\n        if (!list.length) {\n          const now = this.currentTi();\n          const seen = {};\n          for (let t = now; t < now + 4; t++) {\n            const d = this.fromTi(t);\n            Object.keys(this.admHist()).forEach(key => {\n              if (key.split('|')[1] !== d.season) return;\n              const ck = key + '|' + d.year;\n              if (seen[ck]) return;\n              seen[ck] = true;\n              list.push({ ck, key, year: d.year, codes: [] });\n            });\n          }\n        }\n        return list.map(item => {\n          const { ck, key, year, codes } = item;\n          const cyc = this.admCycle()[ck] || {};\n          const own = ((this.state.adm || {})[ck]) || {};\n          const e = { ...cyc, ...own };\n          const rates = this.admRates(key);\n          const proj = this.admProject(key, year);\n          const set = (field, value) => {\n            const all = { ...(this.state.adm || {}) };\n            all[ck] = { ...(all[ck] || {}), [field]: value };\n            this.put({ adm: all, copied: false });\n          };\n          const v = k => (e[k] === undefined || e[k] === null ? '' : String(e[k]));\n          return {\n            label: this.admKeyLabel(key) + ' · ' + this.capw(key.split('|')[1]) + ' ' + year + ' entry',\n            target: e.target !== undefined ? String(e.target) : String(this.admTargets()[key] || ''),\n            admits: v('admits'), coming: v('coming'), final: v('final'),\n            yieldVal: e.yield !== undefined ? String(e.yield) : String(Math.round(rates.yield * 100)),\n            hist: Math.round(rates.yield * 100) + '% yield · ' + Math.round(rates.coming * 100) + '% of admit/coming · ' + rates.years + '-year average'\n              + (cyc.apps ? ' · ' + cyc.apps + ' applications on file' : ''),\n            projected: proj.n, basis: proj.basis,\n            usedLabel: codes.length ? 'used for ' + codes.join(', ') : 'reference — not needed in ' + termLabel,\n            usedColor: codes.length ? '#3a5a9c' : '#b0b0b6',\n            rowBg: codes.length ? '#f7f9fd' : '#fff',\n            setTarget: ev => set('target', ev.target.value.replace(/[^\\d]/g, '')),\n            setAdmits: ev => set('admits', ev.target.value.replace(/[^\\d]/g, '')),\n            setComing: ev => set('coming', ev.target.value.replace(/[^\\d]/g, '')),\n            setFinal: ev => set('final', ev.target.value.replace(/[^\\d]/g, '')),\n            setYield: ev => set('yield', ev.target.value.replace(/[^\\d]/g, '').slice(0, 3)),\n          };\n        });\n      })(),\n      stats: [\n        { label: 'Term', value: termLabel },\n        { label: 'Students counted', value: totalActive },\n        { label: 'Held out', value: totalExcluded },\n        { label: 'Cohorts', value: cohortCards.filter(c => +c.n > 0).length + (this.state.og || []).length },\n        { label: 'Sections projected', value: secTotal(olRows) + secTotal(blRows) + electives.reduce((a, e) => a + (parseFloat(e.sections) || 0), 0) },\n      ],\n\n      olRows, blRows,\n      olCount: secTotal(olRows) + ' sections', blCount: secTotal(blRows) + ' sections',\n      olEmptyDisplay: olRows.length ? 'none' : 'block', blEmptyDisplay: blRows.length ? 'none' : 'block',\n\n      clinPct: this.state.clinPct,\n      setClinPct: e => this.put({ clinPct: e.target.value.replace(/[^\\d]/g, '').slice(0, 3), copied: false }),\n      specNote: declared > 0\n        ? declared + ' students have declared CSW or MAP in the report; the rest split by this percentage.'\n        : 'No declared specializations read yet, so specialized courses split by this percentage.',\n\n      allCohortCodes: cohortCards.map(c => ({ code: c.code })),\n      ogLabel: this.state.ogLabel, ogBase: this.state.ogBase, ogBehind: this.state.ogBehind, ogN: this.state.ogN,\n      setOgLabel: e => this.setState({ ogLabel: e.target.value }),\n      setOgBase: e => this.setState({ ogBase: e.target.value }),\n      setOgBehind: e => this.setState({ ogBehind: e.target.value }),\n      setOgN: e => this.setState({ ogN: e.target.value.replace(/[^\\d]/g, '') }),\n      addOg: () => {\n        const base = this.state.ogBase || (cohortCards[0] && cohortCards[0].code);\n        if (!base) return;\n        this.put({ og: (this.state.og || []).concat([{ label: this.state.ogLabel || base + '*', base, behind: this.state.ogBehind || '1', n: this.state.ogN || '0' }]), ogLabel: '', ogN: '', copied: false });\n      },\n      ogList: (this.state.og || []).map((g, i) => ({\n        desc: g.label + ' · ' + g.n + ' students · ' + g.base + ' grid, ' + g.behind + ' term' + (g.behind === '1' ? '' : 's') + ' behind',\n        remove: () => { const og = (this.state.og || []).slice(); og.splice(i, 1); this.put({ og, copied: false }); },\n      })),\n\n      electives,\n      poolCohorts: b.pool.cohorts.join(', '),\n      poolBreak: [\n        { label: 'Elective slots', seats: b.pool.EL + ' needed · ' + seatsBy.EL + ' planned', from: b.pool.from.EL.join(', ') || '—' },\n        { label: 'APD slots', seats: b.pool.APD + ' needed · ' + seatsBy.APD + ' planned', from: b.pool.from.APD.join(', ') || '—' },\n        { label: 'ACP slots', seats: b.pool.ACP + ' needed · ' + seatsBy.ACP + ' planned', from: b.pool.from.ACP.join(', ') || '—' },\n      ],\n      poolNote: poolTotal > 0\n        ? 'Cohorts in this term need ' + poolTotal + ' elective/APD/ACP seats in total. Which courses run is your call — amber rows are required by a certificate and have no sections yet.'\n        : 'No cohort in this term has an elective, APD or ACP slot.',\n      poolStatus: poolTotal > 0 ? elecSeats + ' seats planned vs ' + poolTotal + ' needed' : '',\n      poolColor: elecSeats >= poolTotal ? '#2e7d5b' : '#b0261f',\n      addElective: () => this.put({ elecExtra: (this.state.elecExtra || []).concat([{ num: 'new' + ((this.state.elecExtra || []).length + 1), name: '' }]) }),\n      clearElectives: () => { const all = { ...this.state.elecOv }; delete all[ovKey]; this.put({ elecOv: all, copied: false }); },\n      autoElectives: () => {\n        const all = { ...this.state.elecOv };\n        all[ovKey] = { ...(all[ovKey] || {}) };\n        const need = {};\n        Object.keys(this.state.certReqs || {}).forEach(code => (this.state.certReqs[code] || []).forEach(q => need[this.suffix(q.num)] = true));\n        let planned = 0;\n        catalog.filter(e => need[this.suffix(e.num)]).forEach(e => { all[ovKey][e.num] = { ...(all[ovKey][e.num] || {}), sections: '1' }; planned += 25; });\n        // The rest of the pool is split by how the same courses actually enrolled in\n        // Spring 2026. A new course is weighted a quarter above the median; a course with\n        // no history and no new flag falls back to a third of it.\n        const rest = catalog.filter(e => !need[this.suffix(e.num)]);\n        const capOf = e => { const o = (all[ovKey][e.num] || elecOv[e.num] || {}); const c = parseInt(o.cap, 10); return c > 0 ? c : 25; };\n        const histOf = e => (e.isNew ? null : this.elecHist(e.num));\n        const known = rest.map(e => (histOf(e) || {}).enr).filter(v => v > 0).sort((a, x) => a - x);\n        const median = known.length ? known[Math.floor(known.length / 2)] : 25;\n        const wOf = e => (histOf(e) || {}).enr || (e.isNew ? median * this.NEW_COURSE_FACTOR : median / 3);\n        const totalW = rest.reduce((a, e) => a + wOf(e), 0);\n        const remaining = Math.max(0, poolTotal - planned);\n        const alloc = rest.map(e => {\n          const want = totalW ? remaining * wOf(e) / totalW : 0;\n          const cap = capOf(e);\n          return { e, cap, want, sec: Math.max(0, Math.round(want / cap)) };\n        });\n        // Rounding rarely lands on the total, so hand the leftover seats to whichever\n        // course is furthest short of its own share (and take back from the most over).\n        const seats = () => alloc.reduce((a, x) => a + x.sec * x.cap, 0);\n        let guard = 200;\n        while (seats() < remaining && guard-- > 0) {\n          alloc.sort((a, x) => (x.want - x.sec * x.cap) - (a.want - a.sec * a.cap));\n          alloc[0].sec++;\n        }\n        alloc.forEach(x => { all[ovKey][x.e.num] = { ...(all[ovKey][x.e.num] || {}), sections: String(x.sec) }; });\n        this.put({ elecOv: all, copied: false });\n      },\n\n      certs, noCertsDisplay: certs.length ? 'none' : 'block',\n      certReqRows, certOptions,\n      reqCert: this.state.reqCert || (certOptions[0] && certOptions[0].code) || '',\n      reqNum: this.state.reqNum, reqName: this.state.reqName, reqSlot: this.state.reqSlot,\n      setReqCert: e => this.setState({ reqCert: e.target.value }),\n      setReqNum: e => this.setState({ reqNum: e.target.value }),\n      setReqName: e => this.setState({ reqName: e.target.value }),\n      setReqSlot: e => this.setState({ reqSlot: e.target.value }),\n      addReq: () => {\n        const code = this.state.reqCert || (certOptions[0] && certOptions[0].code);\n        const num = String(this.state.reqNum || '').trim();\n        if (!code || !num) return;\n        const all = { ...this.state.certReqs };\n        all[code] = (all[code] || []).concat([{ num, name: this.state.reqName || '', slot: this.state.reqSlot || 'EL' }]);\n        this.put({ certReqs: all, reqNum: '', reqName: '', copied: false });\n      },\n\n      notes: this.state.notes,\n      setNotes: e => this.put({ notes: e.target.value, copied: false }),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
